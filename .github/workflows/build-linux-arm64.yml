name: build-linux-arm64
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: sea prepare
        run: pnpm build:sea:prepare
      - name: package sea (linux-arm64)
        run: pnpm --filter @zcode/cli sea --target linux-arm64
      - name: checksum
        run: cd apps/zcode-cli/packages/cli/dist && sha256sum zcode-linux-arm64 > zcode-linux-arm64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-arm64-latest
          name: cli-arm64-latest
          overwrite_files: true
          files: |
            apps/zcode-cli/packages/cli/dist/zcode-linux-arm64
            apps/zcode-cli/packages/cli/dist/zcode-linux-arm64.sha256
