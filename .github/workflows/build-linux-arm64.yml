name: build-linux-arm64
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: install
        run: pnpm install --frozen-lockfile
      - name: prepare
        run: pnpm build:sea:prepare
      - name: build unified distribution
        run: pnpm build:zcode --version 0.17.1-arm64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-arm64-latest
          name: cli-arm64-latest
          overwrite_files: true
          files: |
            dist/zcode/releases/*/zcode-*.tar.gz
            dist/zcode/releases/*/sha256.txt
            dist/zcode/latest.json
